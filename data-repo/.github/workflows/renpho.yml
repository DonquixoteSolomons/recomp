name: Pull Renpho weigh-ins

on:
  schedule:
    # every 3 hours: a weigh-in is never more than ~3 h from reaching the app,
    # and the app can dispatch this workflow on demand from the Pull weigh-ins button
    - cron: "5 */3 * * *"
  workflow_dispatch:         # and a Run button in the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "renpho-api>=0.2.0"
      - run: python renpho_pull.py
        env:
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
      - name: Commit body.json if it changed
        run: |
          git config user.name "recomp-bot"
          git config user.email "recomp-bot@users.noreply.github.com"
          git add body.json
          git diff --cached --quiet || git commit -m "renpho: $(date -u +%F)"
          git push
